name: Build and push image

# The VM never builds this image (too little RAM). On every push to main,
# GitHub Actions builds it and pushes it to GHCR as a public image:
#   ghcr.io/korrykatti/franz-hermann:latest
#   ghcr.io/korrykatti/franz-hermann:<commit-sha>   (immutable, for rollback)
# The VM then deploys with: docker compose pull && docker compose up -d
#
# No token to create or store: the built-in GITHUB_TOKEN is supplied
# automatically by Actions, and a public image can be pulled anonymously.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/korrykatti/franz-hermann:latest
            ghcr.io/korrykatti/franz-hermann:${{ github.sha }}
