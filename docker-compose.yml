services:
  franz-hermann:
    # Public image built and pushed to GHCR by GitHub Actions
    # (.github/workflows/docker.yml) on every push to main.
    # The VM never builds: deploy with `docker compose pull && docker compose up -d`.
    # Never add a `build:` section back or run `up --build` on the VM.
    image: ghcr.io/korrykatti/franz-hermann:latest
    container_name: franz-hermann
    restart: unless-stopped

    # BOT_TOKEN comes from .env — never commit it or bake it into the image.
    env_file:
      - .env
    environment:
      TZ: UTC

    # Persist the JSON cache (data/*.json) across rebuilds/restarts.
    # Use a NAMED volume, not ./data bind mount: the image creates
    # /app/data owned by app (uid 10001). A ./data bind mount is owned
    # by the host user (uid 1000/ubuntu, or root), so the container
    # gets "open data/race.json: permission denied" on WriteFile.
    volumes:
      - franz-data:/app/data

    # No ports: Discord bot uses an outbound websocket only.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  franz-data:
